services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tranzapay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - postgres
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=tranzapay;Username=  ;Password=  
      Jwt__Secret: development-secret-for-tranzapay-change-in-production
    ports:
      - "8080:8080"

volumes:
  postgres-data:
